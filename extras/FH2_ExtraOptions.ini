; Forza Horizon 2 Extra Options
; v0.2.88+extras.1 (fork with time, weather, HUD and local music keys)
; Compatible with Azimuth 0.9.10
; by Arthur (RokkuDayo); fork additions at the end of this file

; INI settings are read at game startup.
; Graphics, camera and HUD options are configured in-game and saved to FH2_ExtraOptions.dat.
; 0 = off, 1 = on.

[Global]
; Toggles the entire feature set of the mod on or off.
Enabled=1

[Content]
; Grants entitlements for all DLC content.
; Treasure Map and VIP DLCs have their own toggles below.
; The Storm Island map will not be accessible if you don't have the DLC package mounted, but it's vehicles will be available regardless.
UnlockDLC=1

; Grants entitlement for VIP status and its perks.
; Double credits and XP rewards, and double bonus on wheelspins.
OfflineVIP=1

; Reveals all bonus boards and barn locations on the mainland and Storm Island.
; Also enables the Treasure Map listing in the Extras menu of the Marketplace tab while offline.
; Important: Enabling this, entering the game, saving, disabling this, and then entering the game again will keep all boards discovered.
UnlockTreasureMap=0

; Bypasses Storm Island event requirements for purchasing the Ranger T6 and #7 SST.
UnlockStormIslandCars=1

[Frontend]
; Boots straight into the "Press Start" menu.
SkipIntro=1

; Enables the "Get In Car" feature during free-roam.
; You can find it by selecting any car in the "My Cars" section of the pause menu.
GetInCarFromPauseMenu=1

; Adds a combined category after the three original rim categories.
; Adds combined aftermarket and stock-rim library categories without changing the game database.
AllRimsCategory=1

; Enables tabs in the pause menu that require an XBOX Live connection.
EnableMarketplace=1
EnableSocial=1
EnableClubs=1
EnableRivals=1

[PhotoMode]
; Removes the camera collision detection and boundaries in photo mode.
FreeCamera=1

[Autodrive]
; Allows you to set a GPS route in free roam and then press F2 or D-pad Down to have the game drive you there.
; Pressing F2/D-pad Down again, steering, accelerating, braking, pausing or arriving restores player control.
Enabled=1

[Profile]
; Uses the Gamerpic.png beside this INI file as the player's avatar.
; Maximum supported dimensions are 2048x2048 and a maximum file size of 16 MB. Square PNG recommended.
CustomGamerpic=1

[Compatibility]
; Allow user-created content privilege checks locally.
; This has no effect on Mezcal.
DisableParentalLocks=1

; Skips Azimuth's save data blob hash and file size comparisons, and rebuilds missing commit markers at startup.
; You still need to follow Azimuth's custom directory structure, but this should make it easier to add new liveries and vinyls to your save.
; This has no effect on Mezcal.
DisableAzimuthSaveChecksums=1

[Files]
; Loose assets beside the game EXE.
; The priority goes: mediaoverride > mediapc > original media.
; Example: media/Camera.zip/CameraGroups.xml becomes mediaoverride/Camera/CameraGroups.xml.
; Restart the game after changing files.
EnableMediaOverrides=1

; ---------------------------------------------------------------------------------------------
; Fork additions. Each key is set in [Keys] below; the startup log lists the key names.
; All of these can also be changed in the game: Options > HUD, below the original rows.

[HUD]
; The HUD key hides or shows the HUD (speedometer, minimap, notifications).
; Menus and in-car dashboard displays are not affected. The choice persists until pressed again.
ToggleHUD=1

[World]
; NextHour advances the time of day by one hour.
; Weather cycles: automatic, frozen as it is now, each weather preset, then automatic again.
; Clock cycles the clock: running, stopped, following your PC's local time.
; ClockSpeed cycles the clock speed: normal, 4x, 16x, 0.25x.
; Rain cycles the rain: automatic, none, light, medium, heavy.
; Events and Bucket List challenges can override these choices.
TimeAndWeatherKeys=1

[Music]
; Plays your own songs through the radio (the game's old Xbox Music path).
; Put MP3 files in a folder named LocalMusic beside forza_durango_release_final.exe (Mount).
; Real folders only (no links) and names without accents: Azimuth refuses the rest.
; FLAC and M4A do not open under Wine. More settings in FH2_Music.ini.
; MusicToggle turns it on or off; MusicNext skips. Changing station on the D-pad leaves it.
LocalMusic=1

[Keys]
; None, F1-F24, A-Z, 0-9, Home, End, Insert, Delete, PageUp, PageDown, Up, Down, Left, Right, Tab,
; Space, Backspace, Enter, Pause, ScrollLock, CapsLock, Numpad0-Numpad9, NumpadAdd,
; NumpadSubtract, NumpadMultiply, NumpadDivide, NumpadDecimal, a punctuation character such as
; [ or ] (follows your keyboard layout), or a virtual-key code such as 0x24.
; ; and # start a comment here, so use their virtual-key codes instead. Avoid Esc: Azimuth uses it.
ToggleHUD=F3
NextHour=F5
Weather=F6
Clock=F7
ClockSpeed=[
Rain=]
MusicToggle=Home
MusicNext=End
