[Music]
; Optional settings for the local music player ([Music] LocalMusic in FH2_ExtraOptions.ini).
; Every line can be removed to use its default.

; File types to play, separated by ;. Media Foundation under Wine opens MP3; FLAC and M4A
; do not open there. Other types depend on the system.
Extensions=mp3

; Folder names to skip inside LocalMusic, separated by ;.
Exclude=

; Music level in percent, before the game's radio volume (which still scales it).
; 100 is the game's own level, which is quiet. Up to 800; too high can distort.
Volume=200

; Where the songs are. By default LocalMusic beside the game EXE, which the game reaches as
; game:\LocalMusic. Change both only if you know Azimuth maps the other folder.
; Folder=
; GameFolder=game:\LocalMusic
